[project]
name = "tweet-image-poster"
version = "0.2.0"
description = "CLI that posts a tweet with up to four images. Dry run by default."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["tweepy>=4.14"]

[project.scripts]
tweet-image = "tweet_image:main"

[tool.setuptools]
py-modules = ["tweet_image"]
