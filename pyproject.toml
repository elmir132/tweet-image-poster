[project]
name = "tweet-image-poster"
version = "0.3.0"
description = "CLI that posts a tweet or a numbered thread with up to four images. Dry run by default."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["tweepy>=4.14"]

[project.scripts]
tweet-image = "tweet_image:main"

[tool.setuptools]
py-modules = ["tweet_image", "tweet_text", "tweet_media", "tweet_threads", "tweet_ledger", "tweet_envfile"]
